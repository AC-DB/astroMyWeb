name: Deploy Astro site to AC-DB.github.io

on:
  # 每次推送到 master 分支时触发部署
  push:
    branches: [ master ]
  # 允许手动触发
  workflow_dispatch:

# 设置必要的权限
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. 检出源码
      - name: Checkout source repository
        uses: actions/checkout@v4

      # 2. 设置 Node.js 环境
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3. 安装依赖
      - name: Install dependencies
        run: npm ci

      # 4. 构建 Astro 项目
      - name: Build Astro site
        run: npm run build

      # 5. 显示构建目录文件列表（状态指示/调试用）
      - name: Show build output
        run: ls -l ./dist

      # 6. 部署到 AC-DB.github.io 仓库的 gh-pages 分支
      - name: Deploy to AC-DB.github.io:gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.PERSONAL_ACCESS_TOKEN }} # 你的 PAT，需提前配置
          publish_dir: ./dist
          external_repository: AC-DB/AC-DB.github.io
          publish_branch: gh-pages
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'

      # 7. 输出部署完成状态信息
      - name: Deployment status
        run: echo "🚀 Astro 站点已自动推送到 https://AC-DB.github.io"