name: Deploy Astro site to AC-DB.github.io

on:
  # 每次推送到 master 分支时触发部署
  push:
    branches: [ master ]
  # 允许手动触发
  workflow_dispatch:

# 设置必要的权限
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v4
      - name: Install, build, and upload your site
        uses: withastro/action@v3
        # with:
          # path: . # 存储库中 Astro 项目的根位置。（可选）
          # node-version: 20 # 用于构建站点的特定 Node.js 版本，默认为 20。（可选）
          # package-manager: pnpm@latest # 应使用哪个 Node.js 包管理器来安装依赖项和构建站点。会根据存储库中的 lockfile 自动检测。（可选）

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:

    - name: List dist directory
      run: |
        echo "查看 dist 目录下内容："
        ls -al ./dist
        echo "递归列出所有 dist 下文件："
        find ./dist

    # 6. 部署到 AC-DB.github.io 仓库的 gh-pages 分支
    - name: Deploy to AC-DB.github.io:gh-pages
      uses: peaceiris/actions-gh-pages@v4
      with:
        personal_token: ${{ secrets.PERSONAL_ACCESS_TOKEN }} # 你的 PAT，需提前配置
        publish_dir: ./dist
        external_repository: AC-DB/AC-DB.github.io
        publish_branch: gh-pages
        user_name: 'github-actions[bot]'
        user_email: 'github-actions[bot]@users.noreply.github.com'

      # 7. 输出部署完成状态信息
    - name: Deployment status
      run: echo "🚀 Astro 站点已自动推送到 https://AC-DB.github.io"

      